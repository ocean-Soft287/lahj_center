name: lahijcenter
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '3.8.1'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.7
  device_preview: ^1.2.0
  flutter_screenutil: ^5.9.0
  flutter_bloc: ^8.1.2
  intl:
  http: ^1.4.0
  dio: ^5.8.0+1
  conditional_builder_null_safety: ^0.0.6
  fluttertoast: ^8.2.1
  url_launcher: ^6.3.1
  hive_generator: ^1.1.0
  build_runner: ^2.1.0
  shared_preferences: ^2.0.18
  flutter_svg: ^2.0.10+1
  skeletonizer: ^2.1.0+1
  encrypt: ^5.0.3
  cached_network_image: ^3.4.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_spinkit: ^5.2.1
  flutter_facebook_auth: ^7.1.1
  share_plus: ^10.1.2
  flutter_secure_storage: ^9.2.4
  auto_size_text: ^3.0.0
  redacted: ^1.0.12
  lottie: ^3.1.3
  go_router: ^14.6.0
  google_fonts: ^4.0.3
  dropdown_button2: ^2.3.9
  image_picker: ^1.1.1
  dartz: ^0.10.1
  cupertino_icons: ^1.0.8
  curved_navigation_bar: ^1.0.6
  smooth_page_indicator: ^1.2.1
  get_it: ^8.0.3
  equatable: ^2.0.7
  dio_cache_interceptor: ^4.0.3
  shimmer: ^3.0.0
  flutter_local_notifications: ^19.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.3
  app_links: ^6.4.0
  path_provider: ^2.1.5
  flutter_native_splash: ^2.4.6
  pretty_dio_logger: 
  internet_connection_checker: ^1.0.0+1




  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/lang/en.json
    - assets/lang/ar.json
    - assets/image/
    - assets/icons/


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:Zilaslab
  fonts:
    - family: Zilaslab
      fonts:
        - asset: assets/fonts/ZillaSlab-Bold.ttf
        - asset: assets/fonts/ZillaSlab-BoldItalic.ttf
        - asset: assets/fonts/ZillaSlab-Italic.ttf
        - asset: assets/fonts/ZillaSlab-Light.ttf
        - asset: assets/fonts/ZillaSlab-LightItalic.ttf
        - asset: assets/fonts/ZillaSlab-Medium.ttf
        - asset: assets/fonts/ZillaSlab-MediumItalic.ttf
        - asset: assets/fonts/ZillaSlab-Regular.ttf
        - asset: assets/fonts/ZillaSlab-SemiBold.ttf
        - asset: assets/fonts/ZillaSlab-SemiBoldItalic.ttf

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true

  image_path: "assets/image/extension_icon.png"
  min_sdk_android: 24 # android min sdk min:16, default 21
  adaptive_icon_background: "assets/image/extension_icon.png"# You can use a color or image for the background
  adaptive_icon_foreground: "assets/image/extension_icon.png" # For adaptive icons on Android


